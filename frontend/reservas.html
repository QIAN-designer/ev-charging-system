<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Voltio | Mis Reservas</title>
  
  <link rel="stylesheet" href="css/minimalist.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m13.5 2-8 12h6l-1 8 8-12h-6l1-8Z"/>
          </svg>
        </span>
        <span>voltio</span>
      </div>

      <nav class="side-nav">
        <a class="nav-item" href="index.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10M9 20v-6h6v6"/>
          </svg>
          <span>Inicio</span>
        </a>
        <a class="nav-item active" href="reservas.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/>
          </svg>
          <span>Reservas</span>
        </a>
        <a class="nav-item" href="horarios.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>Horarios</span>
        </a>
        <a id="nav-admin-link" style="display: none;" class="nav-item" href="admin-dashboard.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/>
          </svg>
          <span>Admin</span>
        </a>
      </nav>

      <div class="side-foot">
        <button class="user-mini">
          <span class="avatar" id="user-avatar-initials">--</span>
          <span class="user-mini-info">
            <strong id="user-display-name">Cargando...</strong>
            <small id="user-display-role">Usuario</small>
          </span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-titles">
          <span class="eyebrow">Historial & Carga</span>
          <h1>Mis Reservas</h1>
        </div>

        <div class="topbar-actions">
          <button id="theme-toggle-btn" class="theme-button" type="button"></button>
          <button id="btn-logout" class="icon-button" title="Cerrar Sesión" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="page-content">
        <!-- Hero de Reserva Activa Más Reciente -->
        <div id="active-booking-container">
          <!-- Renderizado dinámicamente si existe reserva activa -->
        </div>

        <div id="bookings-alert" class="alert-clean" style="margin-bottom: 20px;"></div>

        <!-- Lista Historial Minimalista -->
        <section class="section-block" style="margin-top: 24px;">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Actividad</span>
              <h2>Historial de cargas</h2>
            </div>
            <a href="index.html" class="primary-button" style="text-decoration: none;">
              + Nueva reserva
            </a>
          </div>

          <div class="history-list" id="bookings-history-list">
            <div style="padding: 36px; text-align: center; color: var(--muted);">Cargando historial...</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module">
    import { requireAuth } from './js/guards/authGuard.js';
    import { storage } from './js/utils/storage.js';
    import { bookingsApi } from './js/api/bookings.api.js';
    import { formatDateTime } from './js/utils/date.js';
    import { initTheme } from './js/utils/theme.js';
    import { setupUserMenu } from './js/utils/userMenu.js';
    import { showError, showConfirm } from './js/utils/alerts.js';

    if (requireAuth()) {
      initTheme();
      setupUserMenu();
      const user = storage.getUser();

      document.getElementById('btn-logout').addEventListener('click', () => {
        storage.clear();
        window.location.href = 'login.html';
      });

      const alertBox = document.getElementById('bookings-alert');
      function showAlert(msg, type = 'success') {
        if (type === 'danger' || type === 'error') {
          showError(msg, 'Error en reservas');
          return;
        }
        alertBox.className = 'alert-clean alert-success visible';
        alertBox.textContent = msg;
        setTimeout(() => alertBox.classList.remove('visible'), 5000);
      }

      function formatShortDate(dateStr) {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return { day: '--', month: '---', year: '----', time: '--:--' };
        const months = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
        return {
          day: String(d.getDate()).padStart(2, '0'),
          month: months[d.getMonth()],
          year: d.getFullYear(),
          time: d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })
        };
      }

      async function loadBookings() {
        const heroContainer = document.getElementById('active-booking-container');
        const listContainer = document.getElementById('bookings-history-list');

        try {
          const res = await bookingsApi.getMyBookings();
          const list = res.data || [];

          // Identificar si hay alguna reserva activa
          const active = list.find(b => b.status === 'active');
          if (active) {
            const startD = formatShortDate(active.start_time);
            const endD = formatShortDate(active.end_time);

            heroContainer.innerHTML = `
              <section class="booking-hero">
                <div class="booking-main">
                  <div class="booking-head">
                    <div>
                      <span class="status-pill">
                        <i></i> Reserva activa
                      </span>
                      <h2>${active.charger_name || 'Cargador #' + active.charger_id}</h2>
                      <p>${active.location_description || 'Campus Principal · Plaza reservada'}</p>
                    </div>
                    <div class="booking-date" style="display: flex; gap: 10px; align-items: center;">
                      <strong style="font-family: 'Manrope', sans-serif; font-size: 44px; font-weight: 500;">${startD.day}</strong>
                      <span style="font-size: 10px; line-height: 1.4; color: var(--green); font-weight: 700;">
                        ${startD.month}<br/>${startD.year}
                      </span>
                    </div>
                  </div>
                  <div class="booking-details">
                    <div>
                      <span>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg> Entrada
                      </span>
                      <strong>${startD.time}</strong>
                    </div>
                    <div>
                      <span>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg> Salida
                      </span>
                      <strong>${endD.time}</strong>
                    </div>
                    <div>
                      <span>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m13.5 2-8 12h6l-1 8 8-12h-6l1-8Z"/></svg> Potencia
                      </span>
                      <strong>${active.power_kw ? active.power_kw + ' kW' : '7.4 kW'}</strong>
                    </div>
                  </div>
                  <div class="booking-actions">
                    <button class="secondary-button btn-cancel-active" data-id="${active.id}">Cancelar reserva</button>
                  </div>
                </div>
                <div class="booking-code">
                  <span>Código de entrada</span>
                  <div class="qr" aria-label="Código QR">
                    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                  </div>
                  <strong>VP-${active.id}</strong>
                  <small>LPR asignado a tu matrícula</small>
                </div>
              </section>
            `;

            heroContainer.querySelector('.btn-cancel-active').addEventListener('click', async () => {
              const confirmed = await showConfirm('¿Deseas cancelar esta reserva?', 'Cancelar reserva', 'Sí, cancelar');
              if (!confirmed) return;
              try {
                await bookingsApi.cancelBooking(active.id);
                showAlert('Reserva cancelada correctamente.');
                loadBookings();
              } catch (e) {
                showAlert(e.message, 'danger');
              }
            });
          } else {
            heroContainer.innerHTML = '';
          }

          if (list.length === 0) {
            listContainer.innerHTML = `
              <div style="padding: 44px; text-align: center; color: var(--muted);">
                <p style="font-weight: 600; color: var(--ink);">Aún no tienes ninguna reserva realizada.</p>
                <a href="index.html" class="primary-button" style="margin-top: 14px; display: inline-flex;">Explorar puntos de carga</a>
              </div>
            `;
            return;
          }

          listContainer.innerHTML = list.map(b => {
            const d = formatShortDate(b.start_time);
            let statusColor = 'var(--muted)';
            let statusText = 'Completada';
            if (b.status === 'active') { statusColor = 'var(--green-dark)'; statusText = 'Activa'; }
            else if (b.status === 'cancelled') { statusColor = 'var(--danger)'; statusText = 'Cancelada'; }

            return `
              <article class="history-item">
                <div class="history-logo">#${b.id}</div>
                <div class="history-place">
                  <strong>${b.charger_name || 'Cargador #' + b.charger_id}</strong>
                  <span>${formatDateTime(b.start_time)} · ${b.power_kw ? b.power_kw + ' kW' : 'Campus'}</span>
                </div>
                <div class="history-meta">
                  <span style="font-size: 11px;">0,00 €</span>
                </div>
                <div>
                  <span class="history-status" style="color: ${statusColor};">
                    ${statusText}
                  </span>
                </div>
                <div>
                  ${b.status === 'active' ? `
                    <button class="icon-button btn-cancel-item" data-id="${b.id}" title="Cancelar" style="width: 32px; height: 32px; border-color: var(--line);">
                      &times;
                    </button>
                  ` : ''}
                </div>
              </article>
            `;
          }).join('');

          listContainer.querySelectorAll('.btn-cancel-item').forEach(btn => {
            btn.addEventListener('click', async () => {
              const id = btn.getAttribute('data-id');
              const confirmed = await showConfirm(`¿Cancelar la reserva #${id}?`, 'Cancelar reserva', 'Sí, cancelar');
              if (!confirmed) return;
              try {
                await bookingsApi.cancelBooking(id);
                showAlert(`Reserva #${id} cancelada.`);
                loadBookings();
              } catch (err) {
                showAlert(err.message, 'danger');
              }
            });
          });

        } catch (err) {
          showError(err.message, 'Error al cargar reservas');
          listContainer.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--danger);">${err.message}</div>`;
        }
      }

      loadBookings();
    }
  </script>
</body>
</html>
